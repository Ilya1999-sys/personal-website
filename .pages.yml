media:
  - name: case-images
    label: Изображения кейсов
    input: images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]

content:
  - name: cases
    label: Кейсы
    type: file
    path: content/cases.json
    format: json
    list: true
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: description
        label: Описание
        type: text
        required: true
      - name: image
        label: Обложка
        type: image
        required: true
        options:
          media: case-images
          path: images
          extensions: [jpg, jpeg, png, webp]
      - name: tags
        label: Теги (необязательно, до 5)
        type: string
        list:
          max: 5
      - name: categories
        label: Категории для фильтрации
        type: select
        options:
          values:
            - name: uxui
              label: UXUI
            - name: web
              label: Веб-дизайн
            - name: creative
              label: Креативы
            - name: motion
              label: Моушен
            - name: article
              label: Статьи
          multiple: true
          min: 1
      - name: href
        label: Ссылка на проект
        type: string
        required: true
